<!DOCTYPE html>
<html>
<head>
	<title>Score Analyzer</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
	body {
		background-image: url(or.png);
	}

</style>
</head>
<body>
<br><br><br><br>
<div class="container mt-4" style="background-color: orange;">
	<center><h1 style="color:white;">Score Analyzer</h1></center>

	<center><details ontoggle="message1()">
		<summary>
			<u style="color:black;">Click me!</u> <br>
			<i id="ans"></i>
		</summary>        	
	</details></center>
<br><br><br>

	<div class="d-flex gap-3 my-4">
		
		<div class="text-center">
        <img src="math.png" width="40%" alt="Math Image"><br>
        <input type="number" id="num1" class="form-control" placeholder="Input your grade" style="width: 50%">
    </div>

		<div class="text-center">
        <img src="sci.png" width="70%" alt="Math Image"><br>
        <input type="number" id="num1" class="form-control" placeholder="Input your grade" style="width: 50%">
    </div>

		<div class="text-center">
        <img src="eng.png" width="50%" alt="Math Image"><br>
        <input type="number" id="num1" class="form-control" placeholder="Input your grade"style="width: 50%" >
    </div>

	</div>

	<center><button type="button" class="btn btn-success" onclick="findR()">Calculate your rating</button></center>

	
	<center><p id="result" class="mt-3"></p></center>
</div>

<script>
	function message1() {
		document.getElementById("ans").innerHTML = "Input your scores for them to be computed.";
	}

	function findR() {
		var Avg1 = parseInt(document.getElementById("num1").value);
		var Avg2 = parseInt(document.getElementById("num2").value);
		var Avg3 = parseInt(document.getElementById("num3").value);

		var avg = (Avg1 + Avg2 + Avg3) / 3;
		var rating = "";
		if (avg >= 90) {
			rating = "Excellent";
		} else if (avg >= 80) {
			rating = "Satisfactory";
		} else if (avg >= 70) {
			rating = "Poor";
		} 
		
		document.getElementById("result").innerText = "Your average is " + avg + " and your rating is " + rating;

		alert("Your average is: " + avg + "\nYour rating is: " + rating);
	}
</script>

</body>
</html>
